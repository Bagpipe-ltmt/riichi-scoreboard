<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d3b2e">
<title>场风盘 · 立直麻将</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>

<div class="topbar">
  <span class="title gold">场风盘</span>
  <span class="pill" id="roomPill">—</span>
  <span class="pill" id="phasePill">—</span>
  <span class="spacer"></span>
  <button class="btn sm ghost" id="btnHistory">历史</button>
  <button class="btn sm ghost" id="btnRules">规则</button>
  <button class="btn sm ghost" id="btnClose">关闭房间</button>
  <span class="conn off" id="conn"><span class="dot"></span><span id="connText">连接中</span></span>
</div>

<div class="wrap">

  <!-- ============ 权限告警：本设备没有场风盘主持权限时出现 ============ -->
  <div id="hostWarn" class="card hidden" style="max-width:900px;margin:14px auto 0;border-color:#b4453f">
    <h3 style="margin:0 0 4px;color:#e06c62">这台设备现在没有场风盘权限</h3>
    <div class="muted small" id="hostWarnMsg" style="margin-bottom:12px"></div>
    <div class="row">
      <div class="field"><label>场风盘昵称</label><input class="input" id="hwName" maxlength="16" placeholder="当初建房的账号"></div>
      <div class="field"><label>密码</label><input class="input" id="hwPass" type="password" placeholder="至少 4 位"></div>
    </div>
    <div class="row" style="margin-top:8px">
      <button class="btn gold block" id="btnHwLogin">登录，恢复主持权限</button>
    </div>
  </div>

  <!-- ============ 创建房间 ============ -->
  <section id="createView" class="hidden">
    <div class="card" id="hostAuthCard" style="max-width:640px;margin:24px auto 0">
      <h3 style="margin:0 0 4px">场风盘账号</h3>
      <div class="muted small" style="margin-bottom:14px">
        场风盘需要一个账号登录（4 台玩家设备各自登录自己的账号）。对局记录会存到这个账号名下。
      </div>
      <div id="hostAuthLoggedOut">
        <div class="row">
          <div class="field"><label>昵称</label><input class="input" id="hostName" maxlength="16" placeholder="例如：雀庄BIGFISH"></div>
          <div class="field"><label>密码</label><input class="input" id="hostPass" type="password" placeholder="至少 4 位"></div>
        </div>
        <div class="row" style="margin-top:8px">
          <button class="btn ghost block" id="btnHostLogin">登录</button>
          <button class="btn ghost block" id="btnHostRegister">注册新账号</button>
        </div>
        <div class="muted small" id="hostAuthMsg" style="margin-top:8px;min-height:18px"></div>
      </div>
      <div id="hostAuthLoggedIn" class="hidden" style="display:flex;align-items:center;justify-content:space-between;gap:12px">
        <div>已登录：<b class="gold" id="hostWho">—</b></div>
        <button class="btn ghost" id="btnHostLogout" style="max-width:120px">退出登录</button>
      </div>
    </div>

    <div class="card" style="max-width:640px;margin:14px auto 24px">
      <h3 style="margin:0 0 4px">创建场风盘房间</h3>
      <div class="muted small" style="margin-bottom:14px">创建后会得到 4 位房间号，4 台玩家设备用它入座。</div>

      <div class="field">
        <label>对局形式</label>
        <div class="seg" id="cfgType">
          <div class="opt wide" data-v="tonpuusen">东风战（东四局）</div>
          <div class="opt wide on" data-v="hanchan">半庄战（南四局）</div>
        </div>
      </div>

      <div class="row">
        <div class="field"><label>起始点数</label><input class="input mono" id="cfgStart" type="number" value="25000" step="1000"></div>
      </div>

      <div class="field">
        <label>其他规则</label>
        <div class="seg" id="cfgToggles">
          <div class="opt wide on" data-k="kiriageMangan">切上满贯</div>
          <div class="opt wide on" data-k="agariYame">和了终局</div>
          <div class="opt wide on" data-k="tobi">击飞终局</div>
          <div class="opt wide on" data-k="notenBappu">不听罚符</div>
          <div class="opt wide" data-k="westExtension">西入（南四局无人达基准点）</div>
          <div class="opt wide" data-k="yakitori">烧鸟</div>
        </div>
      </div>

      <button class="btn gold block" id="btnCreate" style="margin-top:6px">创建房间</button>
    </div>
  </section>

  <!-- ============ 大厅 ============ -->
  <section id="lobbyView" class="hidden">
    <div class="card center" style="margin-bottom:14px">
      <div class="muted small">房间号（玩家端输入这个 4 位数）</div>
      <div class="gold" style="font-size:56px;font-weight:900;letter-spacing:.14em" id="lobbyCode">----</div>
      <div class="muted small" id="lobbyHint">等待 4 位玩家入座…</div>
      <div class="stat-strip" style="margin-top:12px;text-align:left" id="lobbyRules"></div>
    </div>

    <div class="join-seats" id="lobbySeats"></div>

    <div class="row" style="margin-top:14px">
      <button class="btn ghost" id="btnEditRules">修改规则</button>
      <button class="btn gold" id="btnStart" disabled>开始对局</button>
    </div>
  </section>

  <!-- ============ 对局中 ============ -->
  <section id="playView" class="hidden">
    <div class="table-grid">
      <div class="seat-card seat-top" id="seatArea2"></div>
      <div class="seat-card seat-left" id="seatArea3"></div>
      <div class="card center-panel seat-center" id="centerPanel"></div>
      <div class="seat-card seat-right" id="seatArea1"></div>
      <div class="seat-card seat-bottom" id="seatArea0"></div>
    </div>

    <div class="action-bar">
      <button class="btn gold" id="btnDice">🎲 掷骰子</button>
      <button class="btn primary" id="btnAgari">和了</button>
      <button class="btn blue" id="btnDraw">流局</button>
      <button class="btn ghost" id="btnAdjust">点数修正</button>
      <button class="btn ghost" id="btnHonba">本场数</button>
      <button class="btn ghost" id="btnUndo">撤销</button>
      <button class="btn red" id="btnEnd">结束对局</button>
    </div>

    <div class="card" style="margin-top:14px">
      <h3 style="margin:0 0 8px;font-size:15px">对局记录</h3>
      <div class="log-list" id="logList"></div>
    </div>
  </section>

  <!-- ============ 结算 ============ -->
  <section id="endView" class="hidden">
    <div class="card">
      <div class="center" style="margin-bottom:12px">
        <div class="gold" style="font-size:24px;font-weight:900" id="endTitle">终局</div>
        <div class="muted small" id="endSub"></div>
      </div>
      <div id="endTable"></div>
      <div class="row" style="margin-top:16px">
        <button class="btn primary" id="btnRematch">再来一局</button>
        <button class="btn gold" id="btnViewRecord">查看存档</button>
      </div>
      <div class="muted tiny center" style="margin-top:10px" id="endSaved"></div>
    </div>

    <div class="card" style="margin-top:14px">
      <h3 style="margin:0 0 8px;font-size:15px">本场对局明细</h3>
      <div id="endHands"></div>
    </div>
  </section>
</div>

<script src="/js/common.js"></script>
<script src="/js/table.js"></script>
</body>
</html>
