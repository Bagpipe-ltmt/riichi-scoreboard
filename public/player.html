<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d3b2e">
<title>玩家端 · 立直麻将</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>

<div class="topbar">
  <span class="title gold">玩家端</span>
  <span class="pill" id="userPill">未登录</span>
  <span class="pill hidden" id="roomPill">—</span>
  <span class="spacer"></span>
  <button class="btn sm ghost hidden" id="btnLeaveRoom">离开房间</button>
  <button class="btn sm ghost hidden" id="btnLogout">退出登录</button>
  <span class="conn off" id="conn"><span class="dot"></span><span id="connText">—</span></span>
</div>

<div class="wrap" style="max-width:620px">

  <!-- ============ 登录 ============ -->
  <section id="authView" class="hidden">
    <div class="card" style="margin-top:16px">
      <h3 style="margin:0 0 12px" id="authTitle">登录</h3>
      <div class="field"><label>昵称</label><input class="input" id="auName" autocomplete="username" maxlength="16" placeholder="1~16 个字符"></div>
      <div class="field"><label>密码</label><input class="input" id="auPass" type="password" autocomplete="current-password" placeholder="至少 4 位"></div>
      <div class="row">
        <button class="btn primary" id="btnLogin">登录</button>
        <button class="btn ghost" id="btnRegister">注册新账号</button>
      </div>
      <div style="margin-top:10px"><button class="btn ghost block" id="btnGuest">以游客身份进入（不保存记录）</button></div>
      <div class="muted tiny" style="margin-top:10px">账号数据保存在场风盘所在设备上，用于区分玩家与保存历史对局。</div>
    </div>
  </section>

  <!-- ============ 输入房间号 ============ -->
  <section id="entryView" class="hidden">
    <div class="card" style="margin-top:16px">
      <h3 style="margin:0 0 6px">加入对局</h3>
      <div class="muted small" style="margin-bottom:12px">输入场风盘上显示的 4 位房间号。</div>
      <div class="row">
        <input class="input mono" id="joinCode" inputmode="numeric" maxlength="4" placeholder="0000" style="font-size:28px;text-align:center;letter-spacing:.3em;flex:2 1 0">
        <button class="btn gold" id="btnJoin" style="flex:1 1 auto">进入</button>
      </div>
    </div>

    <div class="card" style="margin-top:14px">
      <h3 style="margin:0 0 8px;font-size:15px">进行中的房间</h3>
      <div id="roomList"><div class="muted small">读取中…</div></div>
    </div>

    <div class="card" style="margin-top:14px">
      <h3 style="margin:0 0 8px;font-size:15px">我的历史对局</h3>
      <div id="gameList"><div class="muted small">读取中…</div></div>
      <a class="btn ghost block sm" href="/record" style="margin-top:12px;text-align:center;text-decoration:none">📝 手动录入一局（直接填最终点数）</a>
    </div>
  </section>

  <!-- ============ 房间内 ============ -->
  <section id="roomView" class="hidden">
    <div class="card center" style="margin-top:16px">
      <div class="muted small" id="roomPhase">—</div>
      <div class="gold" style="font-size:30px;font-weight:900;letter-spacing:.06em" id="roomRound">—</div>
      <div class="muted small" id="roomSub">—</div>
    </div>

    <div class="card my-panel" id="myPanel" style="margin-top:14px"></div>

    <div class="card" style="margin-top:14px">
      <h3 style="margin:0 0 8px;font-size:15px">座位</h3>
      <div class="join-seats" id="seatList"></div>
    </div>

    <div class="card" style="margin-top:14px">
      <h3 style="margin:0 0 8px;font-size:15px">对局记录</h3>
      <div class="log-list" id="logList"></div>
    </div>
  </section>

  <!-- ============ 结算 ============ -->
  <section id="resultView" class="hidden">
    <div class="card" style="margin-top:16px">
      <div class="center"><div class="gold" style="font-size:22px;font-weight:900" id="resTitle">终局</div>
      <div class="muted small" id="resSub"></div></div>
      <div id="resTable" style="margin-top:12px"></div>
      <button class="btn primary block" id="btnBackEntry" style="margin-top:14px">返回</button>
    </div>
    <div class="card" style="margin-top:14px">
      <h3 style="margin:0 0 8px;font-size:15px">本场明细</h3>
      <div id="resHands"></div>
    </div>
  </section>
</div>

<script src="/js/common.js"></script>
<script src="/js/player.js"></script>
</body>
</html>
